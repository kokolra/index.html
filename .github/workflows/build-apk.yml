name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Java JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 웹앱 패키징 환경 준비 (Capacitor)
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MangaWave com.example.mangawave --web-dir www
          npx cap add android
          npx cap sync

      - name: 안드로이드 APK 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 빌드된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MangaWave-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
